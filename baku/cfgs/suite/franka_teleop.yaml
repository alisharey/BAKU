# @package suite
defaults:
  - _self_
  - task: franka_teleop

suite: franka_teleop
name: "franka_teleop"

frame_stack: 1
action_repeat: 1
discount: 0.99
hidden_dim: 256

# train settings
num_train_steps: 60001
log_every_steps: 500
save_every_steps: 10000
history: false
history_len: 10

# no simulator: evaluate offline (franka/offline_eval.py) or on the robot (franka/deploy.py)
eval_every_steps: 1000000000
num_eval_episodes: 1
eval_history_len: 5

pixel_keys: ["pixels", "pixels_egocentric"]   # third-person (cam_2), wrist (cam_1): LIBERO's order
proprio_key: "proprioceptive"
feature_key: "features"

save_snapshot: true

task_make_fn:
  _target_: suite.franka_teleop.make
  dataset_path: ${dataloader.bc_dataset.path}
  tasks: ${suite.task.tasks}
  pixel_keys: ${suite.pixel_keys}
  height: ${dataloader.bc_dataset.img_size}
  width: ${dataloader.bc_dataset.img_size}
  max_episode_len: ??? # set by train.py
  max_state_dim: ???   # set by train.py
  seed: ${seed}
  eval: ${eval}
