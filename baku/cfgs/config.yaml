defaults:
  - _self_
  - agent: baku
  - suite: libero
  - dataloader: libero
  - override hydra/launcher: submitit_local

# Repository root. Set BAKU_ROOT before launching.
root_dir: ${oc.env:BAKU_ROOT}

# misc
seed: 2
device: cuda
save_video: true
save_train_video: false
use_tb: true
batch_size: 64

# experiment
obs_type: "pixels" # pixels, features
num_demos_per_task: 50
encoder_type: 'resnet_vggt' # base, resnet, vggt, resnet_vggt, dinov2
policy_type: 'gpt' # mlp, gpt
policy_head: deterministic # deterministic, gmm, bet, diffusion, vqbet
use_proprio: true
use_language: true
use_actions: false
prompt: text # text, goal, intermediate_goal
eval: false
experiment: train
experiment_label: ${policy_head}

# action chunking
temporal_agg: true # aggregate actions over time
num_queries: 10

vggt_intermediate_layers:
  - 4
  - 11
  - 17
  - 23

# DINOv2 is loaded from immutable local artifacts. The backbone and optional
# 3DCorrEnhance LoRA/refiner stay frozen; agent.train_encoder controls only the
# trainable 768-to-512 BAKU policy projector for this encoder type. This
# campaign defaults to the terminal-map convolutional projector; override with
# spatial_softmax_v1 only for explicit backward-compatible comparisons.
dinov2_variant: stock # stock, 3dcorr
dinov2_source_path: ${root_dir}/.cache/dinov2/source
dinov2_source_revision: 85a24602099d397264d5b30461ad7f3bfd726ca1
dinov2_backbone_weight_path: ${root_dir}/.cache/dinov2/checkpoints/dinov2_vitb14_pretrain.pth
dinov2_backbone_sha256: 0b8b82f85de91b424aded121c7e1dcc2b7bc6d0adeea651bf73a13307fad8c73
dinov2_adapter_weight_path: ${root_dir}/.cache/dinov2/checkpoints/dinov2_base_3dcorr.ckpt
dinov2_adapter_sha256: 6f83bec78ea83fcec34b30a3e461282715dec9f3bb86a0a1adb6ad2502d5c9b8
dinov2_source_image_size: 126
dinov2_input_size: 224
dinov2_projector_type: final_conv_v1 # final_conv_v1, spatial_softmax_v1

# Opt-in training acceleration.  False preserves the original live-image path.
# When enabled, the dataset returns the terminal pre-L2 dense maps from the
# immutable cache; the agent casts FP16 to FP32, applies the normal channelwise
# L2, and runs the same trainable projector/policy as the live path.
dinov2_feature_cache_enabled: false
dinov2_feature_cache_root: null
dinov2_feature_cache_manifest_sha256: null

camera_pose_variations: null

# expert dataset
expert_dataset: ${dataloader.bc_dataset}
# Load checkpoint (true resume)
load_bc: false
bc_weight: null
hydra:
  run:
    dir: ./exp_local/${suite.suite}_${encoder_type}_train/${now:%m%d}_${now:%H%M%S}_${encoder_type}_${suite.task.suite}_${policy_head}_seed_${seed}
  sweep:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    tasks_per_node: 1
    nodes: 1
    submitit_folder: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S}_${experiment}/.slurm
