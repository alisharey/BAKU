bc_dataset:
  _target_: read_data.franka_teleop.BCDataset
  path: ${root_dir}/expert_demos/franka_teleop
  tasks: ${suite.task.tasks}
  num_demos_per_task: ${num_demos_per_task}
  demo_offset: ${demo_offset}
  obs_type: ${obs_type}
  history: ${suite.history}
  history_len: ${suite.history_len}
  prompt: ${prompt}
  temporal_agg: ${temporal_agg}
  num_queries: ${num_queries}
  img_size: 128
  pixel_keys: ${suite.pixel_keys}
  action_key: actions            # TeleMoMa (as executed); delta_pose_actions for the delta-pose baseline
  normalization: xarm            # as BAKU's xArm loader; none = as LIBERO's (see read_data/franka_teleop.py)
  norm_percentile: 99.5
  augment: true                  # random 4 px shift + color jitter, as BAKU's xArm loader
  store_actions: true
