bc_dataset:
  _target_: read_data.libero.BCDataset
  path: ${oc.env:LIBERO_DATA_ROOT}
  suite: ${suite.task.suite}
  scenes: ${suite.task.scenes}
  tasks: ${suite.task.tasks}
  num_demos_per_task: ${num_demos_per_task}
  obs_type: ${obs_type}
  history: ${suite.history}
  history_len: ${suite.history_len}
  prompt: ${prompt}
  temporal_agg: ${temporal_agg}
  num_queries: ${num_queries}
  img_size: 126
  store_actions: true
  dinov2_feature_cache_enabled: ${dinov2_feature_cache_enabled}
  dinov2_feature_cache_root: ${dinov2_feature_cache_root}
  dinov2_feature_cache_variant: ${dinov2_variant}
  dinov2_feature_cache_manifest_sha256: ${dinov2_feature_cache_manifest_sha256}
